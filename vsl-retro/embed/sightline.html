<!-- Longest Sightline Finder, for a Squarespace Code Block.
     Paste this whole file into the block. The finder tells
     this page how tall it is, and the script below sizes the
     frame to fit, so there is no scrollbar inside it.
     If the block cannot run scripts, the heights in the
     style rules below are used instead. -->
<div class="sightline-embed">
  <iframe
    id="sightline-frame"
    src="https://drburke-droid.github.io/VSL/sightline/?v=1"
    title="Longest Sightline Finder"
    loading="lazy"
    allow="geolocation; clipboard-write; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</div>
<style>
.sightline-embed {
  margin: 32px 0;
}
.sightline-embed iframe {
  display: block;
  width: 100%;
  height: 1700px;
  border: 0;
  background: #fff;
}
@media (max-width: 760px) {
  .sightline-embed iframe {
    height: 3400px;
  }
}
</style>
<script>
(function () {
  var f = document.getElementById('sightline-frame');
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.sightline !== 'height') return;
    if (e.source !== f.contentWindow) return;
    f.style.height = d.height + 'px';
  });
})();
</script>
