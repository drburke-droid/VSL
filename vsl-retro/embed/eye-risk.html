<!-- Eye Health Risk Check, for a Squarespace Code Block.
     Paste this whole file into the block, replacing the old
     <div id="eyeRiskCalc"> calculator. The page's own title
     comes from Squarespace, so the check hides its title here.
     The questionnaire tells this page how tall it is, and the
     script below sizes the frame to fit (no inner scrollbar).
     It also asks to be scrolled into view when the visitor
     moves to the next step. If scripts cannot run, the heights
     in the style rules below are used instead.
     To force browsers to fetch a new version, change ?v=1 to ?v=2. -->
<div class="eyerisk-embed">
  <iframe
    id="eyerisk-frame"
    src="https://drburke-droid.github.io/VSL/eye-risk/?v=1#embed"
    title="Eye Health Risk Check"
    loading="lazy"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</div>
<style>
.eyerisk-embed {
  margin: 24px 0;
}
.eyerisk-embed iframe {
  display: block;
  width: 100%;
  height: 1500px;
  border: 0;
  background: #fff;
}
@media (max-width: 760px) {
  .eyerisk-embed iframe {
    height: 2400px;
  }
}
</style>
<script>
(function () {
  var f = document.getElementById('eyerisk-frame');
  var box = f.closest ? f.closest('.embed-block-wrapper') : null;
  if (box) { box.style.paddingBottom = '0'; box.style.height = 'auto'; }
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || e.source !== f.contentWindow) return;
    if (d.eyerisk === 'height') f.style.height = d.height + 'px';
    if (d.eyerisk === 'top') {
      var r = f.getBoundingClientRect();
      if (r.top < 0 || r.top > window.innerHeight * 0.5) {
        window.scrollTo({ top: window.pageYOffset + r.top - 80, behavior: 'smooth' });
      }
    }
  });
})();
</script>
