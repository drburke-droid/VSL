<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calgary Vision Centre — Today</title>
<meta name="description" content="A 360° tour of Calgary Vision Centre today, on the screen of a tablet.">
<base target="_top">
<style>
  /* The scene is the tablet image at its own size (1130×940); fit() scales it to the viewport.
     The photo has its screen cut out (real rounded shape). Under it, a flat 1024×768 iframe is mapped
     by a projective transform onto the screen's four corners pushed 6px outward, so the bezel always
     overlaps the tour by a few pixels. The tour stays interactive through the transform. */
  html, body { margin: 0; height: 100%; background: #fff; }
  .stage-wrap { position: fixed; inset: 0; overflow: hidden; }
  .stage { position: absolute; left: 50%; top: 50%; width: 1130px; height: 940px; margin: -470px 0 0 -565px; transform-origin: center center; }
  .photo { position: absolute; inset: 0; width: 1130px; height: 940px; display: block; pointer-events: none; z-index: 2; }
  .screen { position: absolute; left: 0; top: 0; width: 1024px; height: 768px; transform-origin: 0 0; z-index: 1;
            transform: matrix3d(1.22395, 0.160651, 0, 0.000232364, 0.0849578, 1.10069, 0, -5.58347e-05, 0, 0, 1, 0, 21.7323, 14.1626, 0, 1); overflow: hidden; background: #000; }
  .screen iframe { display: block; width: 1024px; height: 768px; border: 0; background: #000; }
</style>
</head>
<body>
<div class="stage-wrap">
  <div class="stage" id="stage">
    <div class="screen">
      <iframe src="https://momento360.com/e/u/c18c68696cd54fcc935ffc2a82cc49f9?heading=0&pitch=0&field-of-view=75&size=medium&autoplay-annotations=true&display-plan=true" title="Calgary Vision Centre today: a 360° tour of the clinic" allow="fullscreen"></iframe>
    </div>
    <img class="photo" src="assets/ipad.webp" alt="A tablet, propped at an angle, showing a 360° tour of the clinic">
  </div>
</div>
<script>
  const stage = document.getElementById('stage');
  function fit() { stage.style.transform = `scale(${Math.min(innerWidth / 1130, innerHeight / 940)})`; }
  addEventListener('resize', fit); fit();
</script>
</body>
</html>
